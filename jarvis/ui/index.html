<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg: #08090c;
    --lateral: #0b0d12;
    --panel: #10131a;
    --linea: rgba(255,255,255,.075);
    --linea-fuerte: rgba(255,255,255,.14);
    --cian: #5cd6ff;
    --ambar: #ffb347;
    --texto: #e8eef5;
    --tenue: #8b98a8;
    --apagado: #4d5866;
    --ok: #4ade80;
    --mal: #ff6b6b;
    --fuente: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--texto); font-family: var(--fuente);
    font-size: 15px; display: flex; overflow: hidden;
  }
  button { font-family: inherit; }

  /* ---------------- barra lateral ---------------- */
  #lateral {
    width: 268px; flex: 0 0 268px; background: var(--lateral);
    border-right: 1px solid var(--linea); display: flex; flex-direction: column;
    transition: margin-left .2s ease;
  }
  #lateral.oculto { margin-left: -268px; }
  .cab {
    display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px;
  }
  .reactor {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle, #eaffff 0 10%, var(--cian) 11% 40%, rgba(92,214,255,.18) 41% 100%);
    box-shadow: 0 0 16px rgba(92,214,255,.5); animation: latido 3.6s ease-in-out infinite;
  }
  @keyframes latido { 50% { opacity: 1; box-shadow: 0 0 24px rgba(92,214,255,.85); } 0%,100% { opacity: .78; } }
  .cab b { letter-spacing: .2em; font-size: 12px; font-weight: 600; }
  .cab small { color: var(--apagado); font-size: 10px; margin-left: auto; font-family: var(--mono); }

  .nuevo {
    margin: 4px 12px 12px; padding: 9px; border-radius: 9px; cursor: pointer;
    background: rgba(92,214,255,.1); color: var(--cian);
    border: 1px solid rgba(92,214,255,.28); font-size: 13px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .nuevo:hover { background: rgba(92,214,255,.18); }

  .buscador { margin: 0 12px 10px; display: flex; }
  .buscador input {
    width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--linea);
    border-radius: 8px; padding: 7px 10px; color: var(--texto); font: inherit; font-size: 12px; outline: none;
  }
  .buscador input:focus { border-color: rgba(92,214,255,.4); }

  #listaChats { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  #listaChats::-webkit-scrollbar, #hilo::-webkit-scrollbar, .ajustes-cuerpo::-webkit-scrollbar { width: 8px; }
  #listaChats::-webkit-scrollbar-thumb, #hilo::-webkit-scrollbar-thumb, .ajustes-cuerpo::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  .chat-item {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
    color: #b6c2d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px; position: relative;
  }
  .chat-item:hover { background: rgba(255,255,255,.05); }
  .chat-item.activo { background: rgba(92,214,255,.12); color: #eaf8ff; }
  .chat-item span.t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-item .x { opacity: 0; color: var(--apagado); font-size: 14px; padding: 0 3px; }
  .chat-item:hover .x { opacity: 1; }
  .chat-item .x:hover { color: var(--mal); }
  .vacio-chats { color: var(--apagado); font-size: 11.5px; padding: 12px; text-align: center; }

  .pie-lateral { padding: 10px 12px 12px; border-top: 1px solid var(--linea); display: grid; gap: 8px; }
  .estado-linea { font-size: 10.5px; color: var(--tenue); display: flex; align-items: center; gap: 6px; font-family: var(--mono); }
  .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 7px var(--ok); flex: 0 0 auto; }
  .punto.mal { background: var(--mal); box-shadow: 0 0 7px var(--mal); }
  .punto.gris { background: var(--apagado); box-shadow: none; }

  /* ---------------- principal ---------------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    border-bottom: 1px solid var(--linea); background: rgba(8,9,12,.7); backdrop-filter: blur(8px);
  }
  .titulo-actual { font-size: 13px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
  .flex { flex: 1; }
  .btn-icono {
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
    border: 1px solid var(--linea); background: none; color: var(--tenue);
    cursor: pointer; font-size: 14px;
  }
  .btn-icono:hover { color: var(--texto); border-color: var(--linea-fuerte); background: rgba(255,255,255,.04); }
  .btn-icono[aria-pressed="true"] { color: var(--cian); border-color: rgba(92,214,255,.42); background: rgba(92,214,255,.1); }

  #hilo { flex: 1; overflow-y: auto; padding: 26px 16px 10px; scroll-behavior: smooth; }
  .lienzo { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .turno { display: flex; gap: 12px; animation: entra .18s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(4px); } }
  .avatar {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; margin-top: 2px;
  }
  .turno.usuario .avatar { background: rgba(255,179,71,.18); color: var(--ambar); }
  .turno.bot .avatar { background: rgba(92,214,255,.16); color: var(--cian); }
  .burbuja { min-width: 0; flex: 1; line-height: 1.68; word-wrap: break-word; overflow-wrap: anywhere; }
  .burbuja .cabecera { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--apagado); margin-bottom: 5px; }
  .turno.usuario .burbuja { color: #f2f7fc; }

  .burbuja p { margin: 0 0 10px; }
  .burbuja p:last-child { margin-bottom: 0; }
  .burbuja h1, .burbuja h2, .burbuja h3 { margin: 16px 0 8px; font-size: 15.5px; font-weight: 600; }
  .burbuja ul, .burbuja ol { margin: 6px 0 10px; padding-left: 22px; }
  .burbuja li { margin: 3px 0; }
  .burbuja code { font-family: var(--mono); font-size: .875em; background: rgba(255,255,255,.07); padding: 1.5px 5px; border-radius: 4px; }
  .burbuja pre {
    margin: 10px 0; padding: 11px 13px; background: #05070a; border: 1px solid var(--linea);
    border-radius: 9px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
  }
  .burbuja pre code { background: none; padding: 0; font-size: inherit; }
  .burbuja a { color: var(--cian); }
  .burbuja blockquote { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--linea-fuerte); color: var(--tenue); }
  .burbuja hr { border: none; border-top: 1px solid var(--linea); margin: 14px 0; }

  .cursor::after {
    content: "▍"; color: var(--cian); animation: parpadeo .9s steps(2) infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0; } }

  .herramientas { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 10.5px; font-family: var(--mono); padding: 2px 7px; border-radius: 5px;
    border: 1px solid var(--linea-fuerte); color: var(--tenue); background: rgba(255,255,255,.02);
  }
  .chip.ok { color: var(--ok); border-color: rgba(74,222,128,.3); }
  .chip.mal { color: var(--mal); border-color: rgba(255,107,107,.3); }

  .permiso {
    margin-top: 10px; padding: 11px 13px; border-radius: 9px;
    border: 1px solid rgba(255,179,71,.42); background: rgba(255,179,71,.07);
  }
  .permiso p { margin: 0 0 9px; font-size: 13px; }
  .permiso code { color: var(--ambar); }
  .permiso .botones { display: flex; gap: 8px; }
  .permiso button { font-size: 12px; padding: 6px 13px; border-radius: 7px; cursor: pointer; border: 1px solid; }
  .si { background: rgba(74,222,128,.14); color: var(--ok); border-color: rgba(74,222,128,.36); }
  .no { background: none; color: var(--tenue); border-color: var(--linea-fuerte); }

  .acciones-turno { display: flex; gap: 6px; margin-top: 7px; opacity: 0; transition: opacity .15s; }
  .turno:hover .acciones-turno { opacity: 1; }
  .acciones-turno button {
    font-size: 10.5px; color: var(--apagado); background: none; border: 1px solid transparent;
    border-radius: 5px; padding: 2px 6px; cursor: pointer;
  }
  .acciones-turno button:hover { color: var(--tenue); border-color: var(--linea); }

  /* ---------------- bienvenida ---------------- */
  .bienvenida { max-width: 700px; margin: 8vh auto 0; text-align: center; }
  .bienvenida h2 { font-size: 26px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .bienvenida p { color: var(--tenue); margin: 0 0 26px; font-size: 14px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 9px; text-align: left; }
  .sug {
    padding: 12px 14px; border: 1px solid var(--linea); border-radius: 10px;
    background: rgba(255,255,255,.015); cursor: pointer; font-size: 12.5px; color: #b9c6d4;
    transition: .15s;
  }
  .sug:hover { border-color: rgba(92,214,255,.3); background: rgba(92,214,255,.05); }
  .sug b { display: block; color: var(--texto); font-weight: 500; margin-bottom: 2px; font-size: 13px; }
  .aviso-caja {
    max-width: 700px; margin: 0 auto 18px; padding: 11px 14px; border-radius: 9px;
    border: 1px solid rgba(255,179,71,.35); background: rgba(255,179,71,.06);
    font-size: 12.5px; color: #f0d9b5; line-height: 1.6;
  }
  .aviso-caja code { font-family: var(--mono); background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 4px; color: var(--ambar); }

  /* ---------------- composer ---------------- */
  .composer { padding: 8px 16px 18px; }
  .caja {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--linea); border-radius: 15px;
    padding: 9px 9px 9px 15px; transition: border-color .2s, box-shadow .2s;
  }
  .caja:focus-within { border-color: rgba(92,214,255,.36); box-shadow: 0 0 0 3px rgba(92,214,255,.06); }
  textarea {
    flex: 1; background: none; border: none; outline: none; resize: none; color: var(--texto);
    font: inherit; font-size: 14.5px; line-height: 1.55; padding: 6px 0; max-height: 200px; min-height: 24px;
  }
  textarea::placeholder { color: var(--apagado); }
  .accion-composer {
    width: 33px; height: 33px; border-radius: 9px; border: 1px solid var(--linea);
    background: rgba(255,255,255,.03); color: var(--tenue); cursor: pointer;
    display: grid; place-items: center; font-size: 14px; flex: 0 0 auto; transition: .15s;
  }
  .accion-composer:hover { color: var(--texto); background: rgba(255,255,255,.07); }
  .accion-composer.enviar { background: var(--cian); color: #04121a; border-color: var(--cian); font-weight: 700; }
  .accion-composer.enviar:hover { background: #7ee0ff; }
  .accion-composer.enviar:disabled { background: rgba(255,255,255,.1); color: var(--apagado); border-color: var(--linea); cursor: default; }
  .accion-composer.grabando { color: var(--mal); border-color: rgba(255,107,107,.5); animation: pulso 1.1s infinite; }
  @keyframes pulso { 50% { box-shadow: 0 0 0 6px rgba(255,107,107,.08); } }
  .detalle-composer { max-width: 780px; margin: 7px auto 0; font-size: 10.5px; color: var(--apagado); display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); }

  /* ---------------- ajustes ---------------- */
  dialog {
    border: 1px solid var(--linea-fuerte); border-radius: 15px; background: #0a0d13; color: var(--texto);
    padding: 0; width: min(600px, 94vw); font-family: var(--fuente);
  }
  dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(5px); }
  .aj-cab { padding: 15px 20px; border-bottom: 1px solid var(--linea); display: flex; align-items: center; }
  .aj-cab h3 { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; color: var(--tenue); }
  .ajustes-cuerpo { padding: 18px 20px; display: grid; gap: 15px; max-height: 64vh; overflow-y: auto; }
  label { display: grid; gap: 5px; font-size: 11.5px; color: var(--tenue); }
  label select, label input, label textarea {
    font-family: inherit; font-size: 13px; color: var(--texto); background: rgba(255,255,255,.04);
    border: 1px solid var(--linea-fuerte); border-radius: 8px; padding: 8px 10px; outline: none; width: 100%;
  }
  label select:focus, label input:focus, label textarea:focus { border-color: rgba(92,214,255,.5); }
  label textarea { resize: vertical; min-height: 58px; line-height: 1.5; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .nota { font-size: 11px; color: var(--apagado); line-height: 1.6; margin: 0; }
  .nota code { font-family: var(--mono); color: var(--ambar); }
  .aj-pie { padding: 13px 20px; border-top: 1px solid var(--linea); display: flex; gap: 9px; justify-content: flex-end; align-items: center; }
  .primario {
    font-size: 12.5px; padding: 8px 17px; border-radius: 8px; cursor: pointer;
    background: rgba(92,214,255,.16); color: var(--cian); border: 1px solid rgba(92,214,255,.42);
  }
  .secundario { font-size: 12px; padding: 7px 13px; border-radius: 8px; cursor: pointer; background: none; color: var(--tenue); border: 1px solid var(--linea-fuerte); }
  .estado-ollama { font-size: 11.5px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--linea); background: rgba(255,255,255,.02); line-height: 1.55; }
  .estado-ollama.ok { border-color: rgba(74,222,128,.28); color: #b6f0cc; }
  .estado-ollama.mal { border-color: rgba(255,107,107,.28); color: #ffc9c9; }
  .estado-ollama code { font-family: var(--mono); background: rgba(0,0,0,.4); padding: 1px 5px; border-radius: 4px; }

  @media (max-width: 760px) {
    #lateral { position: fixed; z-index: 20; height: 100%; }
    #lateral.oculto { margin-left: -268px; }
    .titulo-actual { max-width: 30vw; }
  }
</style>
</head>
<body>

<aside id="lateral">
  <div class="cab">
    <div class="reactor"></div>
    <b>JARVIS</b>
    <small id="version">v2</small>
  </div>
  <button class="nuevo" id="btnNuevo">+ Nueva conversación</button>
  <div class="buscador"><input id="buscador" placeholder="Buscar en el historial…"></div>
  <div id="listaChats"></div>
  <div class="pie-lateral">
    <div class="estado-linea"><span class="punto gris" id="puntoEstado"></span><span id="textoEstado">conectando…</span></div>
    <div class="estado-linea" id="lineaModelo">modelo —</div>
  </div>
</aside>

<main>
  <header>
    <button class="btn-icono" id="btnLateral" title="Mostrar/ocultar conversaciones">☰</button>
    <div class="titulo-actual" id="tituloActual">Nueva conversación</div>
    <div class="flex"></div>
    <button class="btn-icono" id="btnHerramientas" aria-pressed="true" title="Permitir que Jarvis actúe en la PC">🛠</button>
    <button class="btn-icono" id="btnVoz" aria-pressed="false" title="Leer las respuestas en voz alta">🔊</button>
    <button class="btn-icono" id="btnAjustes" title="Ajustes">⚙</button>
  </header>

  <div id="hilo"><div class="lienzo" id="lienzo"></div></div>

  <div class="composer">
    <div class="caja">
      <textarea id="entrada" rows="1" placeholder="Escribe o dicta. Enter envía, Shift+Enter salto de línea."></textarea>
      <button class="accion-composer" id="btnMicro" title="Dictar (Chrome o Edge)">🎙</button>
      <button class="accion-composer enviar" id="btnEnviar" title="Enviar" disabled>↑</button>
    </div>
    <div class="detalle-composer">
      <span id="pistaMicro"></span>
      <span id="pistaMotor"></span>
    </div>
  </div>
</main>

<dialog id="modalAjustes">
  <div class="aj-cab">
    <h3>Ajustes</h3>
    <div class="flex"></div>
    <button class="secundario" id="cerrarAjustes">cerrar</button>
  </div>
  <div class="ajustes-cuerpo">
    <div class="estado-ollama" id="estadoOllama">comprobando Ollama…</div>

    <label>Motor
      <select id="cfgProveedor">
        <option value="ollama">Ollama — local, gratis e ilimitado (recomendado)</option>
        <option value="compatible">API compatible con OpenAI (LM Studio, Jan, llama.cpp, OpenRouter…)</option>
        <option value="gemini">Google Gemini (nube, capa gratuita con límite)</option>
        <option value="openai">OpenAI (nube, de pago)</option>
        <option value="anthropic">Anthropic (nube, de pago)</option>
        <option value="ninguno">Sin modelo — solo órdenes directas</option>
      </select>
    </label>

    <div class="fila">
      <label>Modelo
        <input id="cfgModelo" list="listaModelos" placeholder="llama3.2">
        <datalist id="listaModelos"></datalist>
      </label>
      <label>Servidor (solo compatible/ollama)
        <input id="cfgBase" placeholder="http://localhost:1234/v1">
      </label>
    </div>
    <p class="nota" id="notaModelo"></p>

    <label>API key <span id="etiquetaClave"></span>
      <input id="cfgClave" type="password" placeholder="solo para proveedores en la nube">
    </label>

    <label>Personalidad
      <textarea id="cfgPersonalidad" rows="3"></textarea>
    </label>

    <div class="fila">
      <label>Temperatura <input id="cfgTemp" type="number" min="0" max="2" step="0.1"></label>
      <label>Mensajes de contexto <input id="cfgHistorial" type="number" min="4" max="80" step="2"></label>
    </div>

    <div class="fila">
      <label>Voz
        <select id="cfgVoz">
          <option value="auto">Automática (SAPI de Windows)</option>
          <option value="ninguno">Silenciada</option>
        </select>
      </label>
      <label>Voz instalada <select id="cfgVozPreferida"><option value="">(la del sistema)</option></select></label>
    </div>
    <label><input type="checkbox" id="cfgLeerRespuestas" style="width:auto"> Leer cada respuesta en voz alta automáticamente</label>

    <p class="nota">La clave se guarda en <code>jarvis/config.json</code> en tu disco. Nada sale de tu equipo salvo las peticiones al motor que elijas.</p>
  </div>
  <div class="aj-pie">
    <button class="secundario" id="probarVoz">probar voz</button>
    <button class="primario" id="guardarAjustes">Guardar</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const lienzo = $("#lienzo");
const hilo = $("#hilo");
const entrada = $("#entrada");

const estado = {
  chat: null,
  herramientas: true,
  enviando: false,
  proveedor: "ninguno",
  modelo: "",
  nombre: "Jarvis",
  version: "",
  ollama: null,
};

/* ------------------------------------------------------------------ utils */
function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Markdown mínimo pero correcto para lo que devuelven los modelos */
function md(texto) {
  const trozos = String(texto ?? "").split(/```/);
  let salida = "";
  trozos.forEach((trozo, i) => {
    if (i % 2 === 1) {
      const lineas = trozo.replace(/^\n/, "").split("\n");
      const lenguaje = lineas[0].match(/^[\w+-]+$/) ? lineas.shift() : "";
      salida += `<pre><code data-lang="${esc(lenguaje)}">${esc(lineas.join("\n").replace(/\n$/, ""))}</code></pre>`;
      return;
    }
    let html = esc(trozo);
    html = html.replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`);
    html = html.replace(/^###### (.*)$/gm, "<h3>$1</h3>")
               .replace(/^### (.*)$/gm, "<h3>$1</h3>")
               .replace(/^## (.*)$/gm, "<h2>$1</h2>")
               .replace(/^# (.*)$/gm, "<h1>$1</h1>");
    html = html.replace(/\*\*\*([^*]+)\*\*\*/g, "<b><i>$1</i></b>")
               .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
               .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
               .replace(/~~([^~]+)~~/g, "<s>$1</s>");
    html = html.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
    html = html.replace(/^---+$/gm, "<hr>");
    html = html.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

    // listas
    html = html.replace(/(?:^|\n)((?:[-*+] .*(?:\n|$))+)/g, (bloque) => {
      const items = bloque.trim().split("\n").map((l) => `<li>${l.replace(/^[-*+] /, "")}</li>`).join("");
      return `\n<ul>${items}</ul>`;
    });
    html = html.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g, (bloque) => {
      const items = bloque.trim().split("\n").map((l) => `<li>${l.replace(/^\d+\. /, "")}</li>`).join("");
      return `\n<ol>${items}</ol>`;
    });

    // párrafos
    html = html.split(/\n{2,}/).map((p) => {
      const t = p.trim();
      if (!t) return "";
      if (/^<(ul|ol|h\d|pre|blockquote|hr)/.test(t)) return t;
      return `<p>${t.replace(/\n/g, "<br>")}</p>`;
    }).join("");
    salida += html;
  });
  return salida;
}

async function api(ruta, opciones) {
  const r = await fetch(ruta, opciones);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
const post = (ruta, cuerpo) => api(ruta, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo || {}),
});

/* ------------------------------------------------------------------ turnos */
function crearTurno(rol, texto = "") {
  const div = document.createElement("div");
  div.className = `turno ${rol}`;
  div.innerHTML = `
    <div class="avatar">${rol === "usuario" ? "TÚ" : "JR"}</div>
    <div class="burbuja">
      <div class="cabecera">${rol === "usuario" ? "tú" : esc(estado.nombre)}</div>
      <div class="contenido"></div>
    </div>`;
  div.querySelector(".contenido").innerHTML = texto;
  lienzo.appendChild(div);
  bajar();
  return div;
}

function bajar() {
  requestAnimationFrame(() => { hilo.scrollTop = hilo.scrollHeight; });
}

function pintarBienvenida() {
  const eventos = [
    ["Conversación", "¿Qué diferencia hay entre TCP y UDP?", "Explica la diferencia entre TCP y UDP como si tuviera 15 años."],
    ["La máquina", "Estado del equipo", "cuánta ram y disco me queda"],
    ["Productividad", "Ordenar el escritorio", "Lista lo que hay en el escritorio y dime qué puedo borrar"],
    ["Día a día", "Temporizador", "pon un temporizador de 10 minutos"],
  ];
  if (!estado.ollama || !estado.ollama.activo || !(estado.ollama.modelos || []).length) {
    // sin modelo: no prometemos conversación
  }
  lienzo.innerHTML = `
    <div class="bienvenida">
      <h2>¿En qué te ayudo?</h2>
      <p>${estado.proveedor === "ninguno"
        ? "Ahora mismo estoy sin modelo de lenguaje: solo entiendo órdenes directas."
        : `Corriendo con <b>${esc(estado.modelo || estado.proveedor)}</b> en tu equipo. Sin límites de uso.`}</p>
      <div class="rejilla">
        ${eventos.map(([cat, titulo, frase]) => `
          <div class="sug" data-frase="${esc(frase)}">
            <b>${esc(titulo)}</b>${esc(cat)}
          </div>`).join("")}

  lienzo.querySelectorAll(".sug").forEach((n) => {
    n.onclick = () => enviar(n.dataset.frase);
  });
  if (!estado.ollama?.activo || !(estado.ollama?.modelos || []).length) {
    const aviso = document.createElement("div");

    aviso.innerHTML = estado.ollama?.activo
      ? "Ollama está instalado pero no hay modelos. Abre una terminal y ejecuta <code>ollama pull llama3.2</code> — son ~2 GB y a partir de ahí es ilimitado."
      : "No encuentro Ollama en <code>" + esc(estado.ollama?.url || "localhost:11434") + "</code>. Es lo que hace que esto sea un ChatGPT ilimitado y gratis: instálalo desde <b>ollama.com/download</b> y recarga esta página. Mientras tanto funciono con órdenes directas.";
    lienzo.appendChild(aviso);
  }
}

/* ------------------------------------------------------------------ enviar */
async function enviar(textoForzado) {
  const texto = (textoForzado ?? entrada.value).trim();
  if (!texto || estado.enviando) return;

  if (lienzo.querySelector(".bienvenida")) lienzo.innerHTML = "";
  entrada.value = "";
  ajustarAltura();

  crearTurno("usuario", `<p>${esc(texto).replace(/\n/g, "<br>")}</p>`);
  const turno = crearTurno("bot", `<div class="contenido-texto cursor"></div>`);
  const nodo = turno.querySelector(".contenido-texto");

  estado.enviando = true;
  actualizarBoton();

  let acumulado = "";
  let pintarPendiente = false;
  const repintar = () => {
    if (pintarPendiente) return;
    pintarPendiente = true;
    requestAnimationFrame(() => {
      nodo.innerHTML = md(acumulado);
      nodo.classList.add("cursor");
      pintarPendiente = false;
      bajar();
    });
  };

  try {
    const respuesta = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto, chat: estado.chat, herramientas: estado.herramientas }),
    });
    if (!respuesta.ok || !respuesta.body) throw new Error("el servidor no respondió");

    const lector = respuesta.body.getReader();
    const decodificador = new TextDecoder();
    let buffer = "";
    let acciones = [];

    while (true) {
      const { value, done } = await lector.read();
      if (done) break;
      buffer += decodificador.decode(value, { stream: true });
      const bloques = buffer.split("\n\n");
      buffer = bloques.pop() || "";
      for (const bloque of bloques) {
        const evento = /^event: (.+)$/m.exec(bloque)?.[1];
        const datosCrudos = /^data: (.*)$/m.exec(bloque)?.[1];
        if (!evento || !datosCrudos) continue;
        let datos;
        try { datos = JSON.parse(datosCrudos); } catch { continue; }

        if (evento === "meta") {
          if (datos.conversacion && datos.conversacion !== estado.chat) {
            estado.chat = datos.conversacion;
          }
        } else if (evento === "delta") {
          acumulado += datos.texto || "";
          repintar();
        } else if (evento === "aviso") {
          acumulado += `> ${datos.texto}\n\n`;
          repintar();
        } else if (evento === "acciones") {
          acciones = acciones.concat(datos.resultados || []);
          if ((datos.resultados || []).length || (datos.pendientes || []).length) {
            pintarHerramientas(turno, datos.resultados || [], datos.pendientes || []);
          }
        } else if (evento === "fin") {
          if (!acumulado && datos.texto) acumulado = datos.texto;
        } else if (evento === "error") {
          acumulado += `\n\n**Error:** ${datos.mensaje}`;
        }
      }
    }

    nodo.classList.remove("cursor");
    nodo.innerHTML = md(acumulado || "(sin respuesta)");
    if (estado.vozLeer && acumulado) hablar(acumulado);
    añadirAccionesTurno(turno, acumulado);
    cargarChats();
  } catch (err) {
    nodo.classList.remove("cursor");
    nodo.innerHTML = `<p style="color:#ff9d9d">No pude completar el mensaje: ${esc(err.message)}</p>`;
  } finally {
    estado.enviando = false;
    actualizarBoton();
    bajar();
  }
}

function pintarHerramientas(turno, resultados, pendientes) {
  const burbuja = turno.querySelector(".burbuja");
  let cont = burbuja.querySelector(".herramientas");
  if (!cont) {
    cont = document.createElement("div");
    cont.className = "herramientas";
    burbuja.appendChild(cont);
  }
  for (const r of resultados) {
    const chip = document.createElement("span");
    chip.className = "chip " + (r.ok ? "ok" : "mal");
    chip.textContent = r.ok ? `✓ ${r.accion}` : `✗ ${r.accion}`;
    chip.title = r.error || r.frase || "";
    cont.appendChild(chip);
  }
  for (const p of pendientes) mostrarPermiso(burbuja, p);
}

function mostrarPermiso(burbuja, p) {
  const div = document.createElement("div");
  div.className = "permiso";
  div.innerHTML = `
    <p>${esc(p.mensaje)}${p.detalle ? " <code>" + esc(p.detalle) + "</code>" : ""}<br>
    <span style="font-size:11px;color:var(--tenue)">caduca en ${p.expira_en}s</span></p>
    <div class="botones"><button class="si">Confirmar</button><button class="no">Cancelar</button></div>`;
  div.querySelector(".si").onclick = async () => {
    div.querySelector(".botones").innerHTML = "<span class='chip'>ejecutando…</span>";
    try {
      const r = await post("/api/confirmar", { token: p.token });
      div.querySelector(".botones").innerHTML = r.ok
        ? `<span class="chip ok">hecho</span> <span style="font-size:12px">${esc((r.salida || "").slice(0, 300) || r.frase || "")}</span>`
        : `<span class="chip mal">${esc(r.error || "falló")}</span>`;
    } catch (e) {
      div.querySelector(".botones").innerHTML = `<span class="chip mal">${esc(e.message)}</span>`;
    }
  };
  div.querySelector(".no").onclick = () => {
    div.innerHTML = `<p><span class="chip">cancelado</span></p>`;
  };
  burbuja.appendChild(div);
  bajar();
}

function añadirAccionesTurno(turno, texto) {
  const barra = document.createElement("div");
  barra.className = "acciones-turno";
  barra.innerHTML = `<button data-a="copiar">copiar</button><button data-a="hablar">leer</button><button data-a="regenerar">regenerar</button>`;
  barra.onclick = async (ev) => {
    const a = ev.target.dataset.a;
    if (!a) return;
    if (a === "copiar") {
      navigator.clipboard?.writeText(texto);
      ev.target.textContent = "copiado";
      setTimeout(() => (ev.target.textContent = "copiar"), 1200);
    } else if (a === "hablar") {
      hablar(texto);
    } else if (a === "regenerar") {
      const r = await post("/api/chat/regenerar", { chat: estado.chat });
      if (r.ok && r.texto) enviar(r.texto);
    }
  };
  turno.querySelector(".burbuja").appendChild(barra);
}

/* ------------------------------------------------------------------ voz */
function hablar(texto) {
  post("/api/hablar", { texto }).catch(() => {});
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let reconocedor = null, grabando = false, transcripcionFinal = "";

$("#btnMicro").onclick = () => {
  if (!SR) { $("#pistaMicro").textContent = "dictado no disponible: usa Chrome o Edge"; return; }
  if (grabando) { detenerMicro(); return; }
  if (!reconocedor) {
    reconocedor = new SR();
    reconocedor.lang = "es-ES";
    reconocedor.interimResults = true;
    reconocedor.continuous = false;
    reconocedor.onresult = (ev) => {
      let interino = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) transcripcionFinal += t;
        else interino += t;
      }
      entrada.value = (transcripcionFinal + interino).trim();
      ajustarAltura();
    };
    reconocedor.onerror = (ev) => {
      $("#pistaMicro").textContent = "micro: " + ev.error;
      detenerMicro();
    };
    reconocedor.onend = () => {
      const texto = entrada.value.trim();
      detenerMicro();
      if (texto) enviar(texto);
    };
  }
  transcripcionFinal = "";
  grabando = true;
  $("#btnMicro").classList.add("grabando");
  $("#pistaMicro").textContent = "grabando… habla";
  try { reconocedor.start(); } catch { detenerMicro(); }
};

function detenerMicro() {
  grabando = false;
  $("#btnMicro").classList.remove("grabando");
  $("#pistaMicro").textContent = SR ? "dictado en español (navegador)" : "dictado no disponible";
  try { reconocedor?.stop(); } catch {}
}

/* ------------------------------------------------------------------ composer */
function ajustarAltura() {
  entrada.style.height = "auto";
  entrada.style.height = Math.min(entrada.scrollHeight, 200) + "px";
}

function actualizarBoton() {
  const listo = entrada.value.trim().length > 0 && !estado.enviando;
  const b = $("#btnEnviar");
  b.disabled = !listo;
  b.textContent = estado.enviando ? "■" : "↑";
}

entrada.addEventListener("input", () => { ajustarAltura(); actualizarBoton(); });
entrada.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); enviar(); }
});
$("#btnEnviar").onclick = () => {
  if (estado.enviando) return;
  enviar();
};

$("#btnHerramientas").onclick = () => {
  estado.herramientas = !estado.herramientas;
  $("#btnHerramientas").setAttribute("aria-pressed", String(estado.herramientas));
  $("#pistaMotor").textContent = estado.herramientas ? "con control de la PC" : "solo conversación";
};

$("#btnVoz").onclick = async () => {
  estado.vozLeer = !estado.vozLeer;
  $("#btnVoz").setAttribute("aria-pressed", String(estado.vozLeer));
  await post("/api/config", { config: { voz: { leer_respuestas: estado.vozLeer } } });
};

$("#btnLateral").onclick = () => $("#lateral").classList.toggle("oculto");

/* ------------------------------------------------------------------ chats */
async function cargarEstado() {
  try {
    const e = await api("/api/estado");
    Object.assign(estado, {
      nombre: e.nombre, version: e.version, proveedor: e.cerebro,
      modelo: e.modelo, ollama: e.ollama, vozLeer: e.leer_respuestas,
    });
    $("#version").textContent = "v" + e.version.split(".")[0];
    $("#textoEstado").textContent = e.cerebro === "ninguno" ? "sin modelo" : e.cerebro;
    $("#puntoEstado").className = "punto " + (e.cerebro === "ninguno" ? "gris" : "ok");
    $("#lineaModelo").textContent = "modelo: " + (e.modelo || "—");
    $("#pistaMotor").textContent = estado.herramientas ? "con control de la PC" : "solo conversación";
    $("#btnVoz").setAttribute("aria-pressed", String(!!e.leer_respuestas));
    estado.vozLeer = !!e.leer_respuestas;
    if ($("#listaModelos").children.length === 0 && e.ollama?.modelos?.length) {
      $("#listaModelos").innerHTML = e.ollama.modelos.map((m) => `<option value="${esc(m)}">`).join("");
    }
  } catch {
    $("#textoEstado").textContent = "sin conexión";
    $("#puntoEstado").className = "punto mal";
  }
}

async function cargarChats() {
  try {
    const r = await api("/api/chats");
    const lista = $("#listaChats");
    if (!r.chats.length) {
      lista.innerHTML = `<div class="vacio-chats">Aún no hay conversaciones</div>`;
      return;
    }
    lista.innerHTML = r.chats.map((c) => `
      <div class="chat-item ${c.id === estado.chat ? "activo" : ""}" data-id="${c.id}">
        <span class="t">${esc(c.titulo)}</span>
        <span class="x" data-borrar="${c.id}" title="borrar">×</span>
      </div>`).join("");
  } catch { /* silencio */ }
}

$("#listaChats").onclick = async (ev) => {
  const borrar = ev.target.dataset.borrar;
  if (borrar) {
    ev.stopPropagation();
    await post("/api/chat/borrar", { chat: borrar });
    if (estado.chat === borrar) { estado.chat = null; pintarBienvenida(); $("#tituloActual").textContent = "Nueva conversación"; }
    cargarChats();
    return;
  }
  const item = ev.target.closest(".chat-item");
  if (!item) return;
  await abrirChat(item.dataset.id);
};

async function abrirChat(ident) {
  const r = await api("/api/chats/" + ident);
  if (!r.ok) return;
  estado.chat = ident;
  $("#tituloActual").textContent = r.chat.titulo;
  lienzo.innerHTML = "";
  for (const m of r.mensajes) {
    if (m.rol === "user") {
      crearTurno("usuario", `<p>${esc(m.contenido).replace(/\n/g, "<br>")}</p>`);
    } else {
      const turno = crearTurno("bot", md(m.contenido));
      añadirAccionesTurno(turno, m.contenido);
    }
  }
  if (!r.mensajes.length) pintarBienvenida();
  cargarChats();
  bajar();
}

$("#btnNuevo").onclick = () => {
  estado.chat = null;
  $("#tituloActual").textContent = "Nueva conversación";
  pintarBienvenida();
  cargarChats();
  entrada.focus();
};

$("#buscador").addEventListener("keydown", async (ev) => {
  if (ev.key !== "Enter") return;
  const q = ev.target.value.trim();
  if (!q) return;
  const r = await api("/api/buscar?q=" + encodeURIComponent(q));
  const lista = $("#listaChats");
  if (!r.resultados.length) {
    lista.innerHTML = `<div class="vacio-chats">Sin resultados</div>`;
    return;
  }
  const vistos = new Map();
  r.resultados.forEach((x) => { if (!vistos.has(x.conversacion)) vistos.set(x.conversacion, x.extracto); });
  lista.innerHTML = [...vistos].map(([id, extracto]) => `
    <div class="chat-item" data-id="${id}" title="${esc(extracto)}">
      <span class="t">${esc(extracto.slice(0, 46))}</span>
    </div>`).join("");
});

/* ------------------------------------------------------------------ ajustes */
async function abrirAjustes() {
  const r = await api("/api/config");
  const c = r.config;
  $("#cfgProveedor").value = c.cerebro.proveedor || "ninguno";
  $("#cfgModelo").value = c.cerebro.modelo || "";
  $("#cfgBase").value = c.cerebro.base_url || "";
  $("#cfgClave").value = "";
  $("#cfgClave").placeholder = c.cerebro.api_key ? `guardada (${c.cerebro.api_key}) — escribe otra para cambiar` : "solo para proveedores en la nube";
  $("#cfgPersonalidad").value = c.cerebro.personalidad || "";
  $("#cfgTemp").value = c.cerebro.temperatura ?? 0.7;
  $("#cfgHistorial").value = c.cerebro.max_historial ?? 24;
  $("#cfgVoz").value = c.voz.motor || "auto";
  $("#cfgLeerRespuestas").checked = !!c.voz.leer_respuestas;

  const voces = await api("/api/voces").catch(() => ({ voces: [] }));
  $("#cfgVozPreferida").innerHTML = '<option value="">(la del sistema)</option>' +
    (voces.voces || []).map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  $("#cfgVozPreferida").value = c.voz.voz_preferida || "";

  await comprobarOllama();
  $("#modalAjustes").showModal();
}

async function comprobarOllama() {
  const caja = $("#estadoOllama");
  caja.className = "estado-ollama";
  caja.textContent = "comprobando Ollama…";
  const m = await api("/api/modelos").catch((e) => ({ ok: false, error: e.message }));
  const e = await api("/api/estado").catch(() => null);
  const ollama = e?.ollama;
  if (ollama?.activo) {
    const modelos = ollama.modelos || [];
    caja.className = "estado-ollama ok";
    caja.innerHTML = modelos.length
      ? `Ollama activo en <code>${esc(ollama.url)}</code> · modelos: <b>${esc(modelos.join(", "))}</b>`
      : `Ollama activo en <code>${esc(ollama.url)}</code> pero sin modelos. Ejecuta <code>ollama pull llama3.2</code>.`;
  } else {
    caja.className = "estado-ollama mal";
    caja.innerHTML = `Ollama no responde en <code>${esc(ollama?.url || "localhost:11434")}</code>. ` +
      `Instálalo desde <b>ollama.com/download</b> (Windows/Mac/Linux), o usa otro motor abajo.`;
  }
  if (m.ok && m.modelos?.length) {
    $("#listaModelos").innerHTML = m.modelos.map((x) => `<option value="${esc(x)}">`).join("");
    if (!$("#cfgModelo").value) $("#cfgModelo").value = m.modelos[0];
  }
}

$("#btnAjustes").onclick = abrirAjustes;
$("#cerrarAjustes").onclick = () => $("#modalAjustes").close();

$("#probarVoz").onclick = () => {
  hablar("Sistemas en línea. Soy Jarvis.");
};

$("#cfgProveedor").onchange = () => {
  const p = $("#cfgProveedor").value;
  $("#etiquetaClave").textContent = ["openai", "anthropic", "gemini", "compatible"].includes(p) ? "— necesaria" : "— no necesaria";
  $("#cfgBase").placeholder = p === "compatible" ? "http://localhost:1234/v1" : "vacío = por defecto";
  $("#notaModelo").innerHTML = {
    ollama: "Cualquier modelo de <code>ollama list</code>. Para 8 GB de RAM: <code>llama3.2</code> o <code>qwen2.5:3b</code>.",
    compatible: "El nombre exacto que cargaste en LM Studio / Jan / llama.cpp.",
    gemini: "Ej. <code>gemini-2.0-flash</code>. Capa gratuita con límite de peticiones por minuto.",
    openai: "Ej. <code>gpt-4o-mini</code>. Se cobra por uso.",
    anthropic: "Ej. <code>claude-3-5-haiku-latest</code>. Se cobra por uso.",
    ninguno: "Sin modelo: solo entiendo órdenes directas del sistema.",
  }[p] || "";
};
$("#cfgProveedor").onchange();

$("#guardarAjustes").onclick = async () => {
  const proveedor = $("#cfgProveedor").value;
  const base = $("#cfgBase").value.trim();
  await post("/api/config", {
    config: {
      cerebro: {
        proveedor,
        modelo: $("#cfgModelo").value.trim(),
        base_url: base,
        personalidad: $("#cfgPersonalidad").value.trim(),
        temperatura: parseFloat($("#cfgTemp").value) || 0.7,
        max_historial: parseInt($("#cfgHistorial").value, 10) || 24,
      },
      voz: { motor: $("#cfgVoz").value, voz_preferida: $("#cfgVozPreferida").value, leer_respuestas: $("#cfgLeerRespuestas").checked },
    },
  });
  const clave = $("#cfgClave").value.trim();
  if (clave) {
    await post("/api/config/clave", { api_key: clave, proveedor, modelo: $("#cfgModelo").value.trim() });
  }
  $("#modalAjustes").close();
  await cargarEstado();
  if (lienzo.querySelector(".bienvenida") || !lienzo.children.length) pintarBienvenida();
  $("#lineaModelo").textContent = "modelo: " + (estado.modelo || "—");
};

/* ------------------------------------------------------------------ arranque */
(async () => {
  await cargarEstado();
  await cargarChats();
  pintarBienvenida();
  $("#btnHerramientas").setAttribute("aria-pressed", "true");
  $("#pistaMicro").textContent = SR ? "dictado en español (navegador)" : "dictado no disponible: Chrome o Edge";
  $("#pistaMotor").textContent = "con control de la PC";
  actualizarBoton();
  ajustarAltura();
  entrada.focus();
  setInterval(cargarEstado, 20000);
})();
</script>
